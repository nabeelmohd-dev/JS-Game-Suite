<head>

    <style>

        .icon { font-size: 50px; margin-bottom: 15px; display: block; }
        h3 { margin: 10px 0; }
        p { color: #666; font-size: 14px; }
    </style>
</head>
<body>

    <header>
        <h1>🎮 JavaScript Game Suite</h1>
        <p>A collection of mini-games exploring DOM manipulation and Logic.</p>

    <div class="grid">

            <span class="icon">🎲</span>

            <p>Multiplayer game using random number generation and timers.</p>
        </a>

        <a href="lucky-number/index.html" class="card">

            <h3>Lucky Number</h3>

        <a href="picture-quiz/index.html" class="card">
